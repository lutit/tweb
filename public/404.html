<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Not found</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
          system-ui, -system-ui, "Segoe UI", Roboto, sans-serif;
        background: #ffffff;
        color: #222222;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .wrap {
        max-width: 420px;
        width: 100%;
        padding: 32px 16px;
      }
      .title {
        font-size: 42px;
        font-weight: 600;
        color: #0088cc;
        margin-bottom: 8px;
      }
      .subtitle {
        font-size: 16px;
        color: #777777;
        margin-bottom: 24px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 44px;
        min-width: 140px;
        padding: 0 18px;
        border: none;
        background: #2481cc;
        color: #ffffff;
        font-size: 15px;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
      }
      .btn:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="title">404</div>
      <div class="subtitle">
        Page not found. The link you followed may be broken or the page may have been removed.
      </div>
      <a href="/" class="btn">Back to Telegram Web</a>
    </div>
  </body>
</html>
